# (optional) Miesto, alebo zoznam miest, kde sa akcia kona
places:
  - Štítary (Táborová základna JUNIOR)

# Informacie o sutaziacich.
contestants:
  # Minimalny rocnik, ktory sa moze zapojit
  min: null
  # Maximalny rocnik, ktory sa moze zapojit
  max: null
  # Mozne hodnoty: zs1, zs2, ..., zs9; ss1, ..., ss4, null (bez hranice)
  # (V textu se uvádí středoškoláci i "ostatní účastníci", takže null/bez hranice dává největší smysl)

# Popis akcie, dlzka najviac 255 znakov
info: "Pojeď s námi objevovat Sudety! Během výletů se podíváme na kaňon řeky Dyje, flóru a faunu Podyjí i zámek Vranov nad Dyjí. Užijeme si kytaření, pouštění draků či sudetskou tancovačku. Biologičtí odborníci budou k mání po celou dobu akce."

