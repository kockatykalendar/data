# Mriežkou sa označujú komentáre

# Nazov udalosti
name: "Podzimní IBIS víkendovka"

# Vedne obory (1+) pre danu akciu. Mozne hodnoty: mat, fyz, inf, bio, chem a other.
sciences:
  - bio

# Typ akcie. Moznosti: sutaz, seminar, sustredenie, vikendovka, tabor, olympiada alebo prednasky
type: seminar

# Informacie k datumom.
date:
  # Zaciatok udalosti alebo datum udalosti, ak trva iba den. Format YYYY-MM-DD
  start: "2026-11-27"
  # (optional) Koniec udalosti YYYY-MM-DD (napr. deadline odovzdania sady)
  end: "2026-11-29"
  # (optional) Text, ktory sa zobrazi miesto datumu. Vyuzitie napriklad ak nie je este znamy presny datum
  # text: "do 15. 11. 2026"

# nazov organizatora alebo zoznam organizatorov
organizers:
  - ibis

# (optional) Odkaz na stranku pre viac info
link: https://ibis.sci.muni.cz/?articleid=148

# (optional) Miesto, alebo zoznam miest, kde sa akcia kona
places:
  - MUNI, univerzitní kampus Bohunice, Kamenice 5, 625 00 Bohunice

# Informacie o sutaziacich.
contestants:
  # Maximalny rocnik, ktory sa moze zapojit
  min: ss1
  max: ss4

# Popis akcie, dlzka najviac 255 znakov (aktualne ma 239 znakov)
info: "Přihlas se na IBIS víkendovku na MUNI v Brně plnou biologického programu od zkoumání mikrosvěta v laboratoři po učení o lidském těle. Nebude chybět ani žážitkový program a seznámení s vrstevníky sdílející zájem o biologii. Podmínkou účasti je do 8. 11. 2026 (včetně) odevzdat řešení alespoň jedné z úloh 1. sady. Můžete se však přihlásit už teď a vaše účast bude v případě odevzdání aspoň jedné úlohy a dostupných kapacit přijata. Odkaz na příhlášení a více informací najde na naších stránkách."

# (optional) Zmena defaultnej farby (ktora sa vybera podla vedy), IBIS pouziva modru
color: "#1077C1"

# (optional) Udaje k notifikaciam
notifications:
  # Zoznam poctu dni pred deadlinom / akciou, kedy sa ma posielat mail zaujemcom
  remind_days_before:
    - 7
