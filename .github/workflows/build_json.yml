name: Build JSON for pages

on:
  push:
    branches:
      - master

permissions:
  contents: write  # push to the gh-pages branch

jobs:
  gh-pages:
    name: Deploy to Github pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          single-commit: true
          # v4 cleans by default, which would delete CNAME (not produced by the build)
          # from gh-pages. Keep the v3 behaviour of not removing existing files.
          clean: false

      - name: Rebuild iCal
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CI_ACCESS_TOKEN }}
          repository: kockatykalendar/ical
          event-type: rebuild-ical
