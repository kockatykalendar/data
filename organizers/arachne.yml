info: "Sdružení Arachne pořádá každoročně biologická soustředění (jarní, letní a podzimní) pro středoškoláky. Cílem je teoreticky i prakticky demonstrovat krásy biologie a přírodních věd, podpořit samostatné uvažování a práci s výsledky pozorování. Akce probíhají za účasti odborných lektorů, zejména studentů a pedagogů z PřF UK a dalších vědeckých institucí z ČR."
