name: IBIS
icon: IBIS.svg
web: https://ibis.sci.muni.cz/
type: oz
info: >-
  IBIS (Interaktivní biologický seminář) pořádá celoroční korespondenční
  soutěž, podzimní a jarní víkendová setkání a letní týdenní odborné
  soustředění K-SCUK pro nejlepší řešitele. Seminář organizují studenti
  Přírodovědecké a Lékařské fakulty Masarykovy univerzity a úspěšné řešení
  ti může pomoci při přijímacím řízení na tyto fakulty.
country: cz
