info: "MathComps je stránka o súťažnej matematike: archív úloh z česko-slovenských aj medzinárodných súťaží, študijné materiály a sprievodca seminármi a súťažami. Sprevádza ich AI četbotka Mathilda, ktorej môžeš vysvetliť svoje riešenie a nechať si od nej poradiť. Pod názvom Mathildovanie beží aj séria vlastných mesačných online AI súťaží, kde sa riešenie vysvetľuje Mathilde v súťažnom čase."
